# =============================================================================
# GitHub Actions Workflow - 澳洲股市投资周报
# =============================================================================
# 说明：
# 1. 在 GitHub 仓库设置中添加以下 Secrets：
#    - ZAI_API_KEY: Z.ai GLM API密钥
#    - GMAIL_ADDRESS: Gmail邮箱地址
#    - GMAIL_APP_PASSWORD: Gmail应用密码
#    - RECIPIENT_EMAIL: 收件人邮箱（可选）
#
# 2. 添加 Secrets 的方式：
#    GitHub 仓库 -> Settings -> Secrets and variables -> Actions -> New repository secret
# =============================================================================

name: ASX Weekly Investment Report

on:
  # 每周六早上8:00（UTC时间）运行 = 悉尼时间周六下午7:00 / 北京时间周六下午4:00
  # 如需调整时间，请修改 cron 表达式
  schedule:
    - cron: '0 8 * * 6'

  # 允许手动触发
  workflow_dispatch:

  # 允许在主分支推送时触发（用于测试）
  # push:
  #   branches: [ main ]

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 创建 .env 文件（从 GitHub Secrets）
      - name: Create .env file
        run: |
          echo "ZAI_API_KEY=${{ secrets.ZAI_API_KEY }}" >> .env
          echo "GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}" >> .env

      # 运行周报脚本
      - name: Generate ASX weekly report
        run: python3 asx_weekly_reporter.py
        env:
          # 确保 Python 脚本能读取环境变量
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

      # 上传报告文件（可选）
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asx-report-${{ github.run_number }}
          path: |
            *.html
            *.txt
          retention-days: 30

      # 如果失败，发送通知
      - name: Report failure
        if: failure()
        run: echo "ASX周报生成失败，请检查日志"
